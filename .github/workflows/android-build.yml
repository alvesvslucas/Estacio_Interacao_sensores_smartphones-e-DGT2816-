name: Compilar aplicativo Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK previamente instalado no runner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "O runner precisa ter Android SDK configurado previamente." >&2
            exit 1
          fi
          test -f "$sdk_root/platforms/android-36/android.jar"
          test -x "$sdk_root/build-tools/36.0.0/aapt2"
      - name: Build e lint sem assinatura de release ou emulador
        run: bash ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :app:assembleDebug :app:lintDebug
